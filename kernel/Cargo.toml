[package]
name = "kos-kernel"
version = "0.1.0"
edition = "2024"


[dependencies]
kos-derive = { path = "crates/kos-derive" }

[dependencies.hashbrown]
version = "0.17.1"
default-features = false
features = ["alloc", "default-hasher"]

[dependencies.lazy_static]
version = "1.5.0"
default-features = false
features = ["spin_no_std"]

[dependencies.log]
version = "0.4.33"
default-features = false

[dependencies.smoltcp]
version = "0.13.1"
default-features = false
features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-udp",
    "socket-tcp",
    "socket-icmp",
    "socket-dhcpv4",
    "socket-dns",
    "proto-dhcpv4",
    "proto-dns",
    "alloc",
    "log"
]

[dependencies.fatfs]
git = "https://github.com/rafalh/rust-fatfs"
default-features = false
features = ["alloc", "lfn"]

[dependencies.base64]
version = "0.22.1"
default-features = false

[dependencies.elf]
version = "0.8.0"
default-features = false
features = ["alloc"]

[dependencies.libm]
version = "0.2.16"

[dependencies.nopng]
version = "0.3.0"

[dependencies.embedded-tls]
version = "0.19.0"
default-features = false
features = ["log", "rustpki", "rsa", "ed25519", "p384"]

[dependencies.kai]
path = "crates/kai"

[dependencies.lighthouse]
path = "crates/lighthouse"
default-features = false

[dependencies.embedded-io]
version = "0.7.1"

[dependencies.rand_core]
version = "0.6.4"
default-features = false

# ChaCha20, the kernel's random number generator (rand::fill), seeded from RNDR.
[dependencies.rand_chacha]
version = "0.3.1"
default-features = false

# Already built for TLS; the crypto syscall (crypto.rs) uses them directly.
[dependencies.sha2]
version = "0.10.9"
default-features = false

[dependencies.hmac]
version = "0.12.1"
default-features = false

[dependencies.aes-gcm]
version = "0.10.3"
default-features = false
features = ["aes"]

[dependencies.rusty_jpeg]
version = "0.4.7"
default-features = false

[dependencies.heic]
version = "0.1.6"
default-features = false

[dependencies.rust_h264]
version = "0.5.0"
default-features = false

[dependencies.argon2]
version = "0.6.0"
default-features = false
features = ["alloc", "password-hash"]

[features]
test_exec = []
test_alloc_overflow = []
test = []
restart_secondary = []
